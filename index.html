<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Seed</title>
<meta name="theme-color" content="#FAF4E4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Seed">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* SPLASH */
#splash{position:fixed;inset:0;z-index:9999;background:#FAF4E4;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease;}
#splash.hidden{opacity:0;pointer-events:none;}
.dark #splash{background:#100E08;}
.splash-logo{font-family:'Lora',serif;font-size:3rem;font-weight:700;color:#C49A2A;font-style:italic;letter-spacing:0.02em;animation:pulse-logo 1.8s ease-in-out infinite;}
.splash-logo span{color:#A03020;font-style:normal;}
@keyframes pulse-logo{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.6;transform:scale(0.97);}}

:root{
  --bg:#FAFAF7;--bg2:#F3F1EA;--card:#FFFFFF;--card2:#F7F5EE;
  --border:#E8E4D8;--ink:#1A1208;--ink2:#4A3F2A;--ink3:#9A8E78;
  --gold:#C49A2A;--gold-bg:#FBF3DC;--gold-border:#E8D48A;
  --red:#A03020;--green:#2A6A3A;--blue:#1A5A8A;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 12px rgba(0,0,0,0.08),0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg:0 12px 32px rgba(0,0,0,0.10),0 4px 8px rgba(0,0,0,0.05);
  --radius:16px;--radius-sm:10px;--radius-lg:24px;
}
.dark{
  --bg:#100E08;--bg2:#1A1610;--card:#1E1A12;--card2:#252018;
  --border:#302A1E;--ink:#F0EAD8;--ink2:#C8B890;--ink3:#7A6E58;
  --gold:#D4A830;--gold-bg:#2A2010;--gold-border:#4A3A18;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.3);
  --shadow-md:0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg:0 12px 32px rgba(0,0,0,0.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;transition:background 0.25s,color 0.25s;overscroll-behavior:none;}
.app-shell{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;max-width:1400px;margin:0 auto;position:relative;}

/* HEADER */
.app-header{position:sticky;top:0;z-index:100;background:var(--bg);padding:0 1.5rem;height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.header-logo{font-family:'Lora',serif;font-size:1.5rem;font-weight:700;color:var(--gold);letter-spacing:0.02em;font-style:italic;}
.header-logo span{color:var(--red);font-style:normal;}
.header-right{display:flex;align-items:center;gap:0.5rem;position:relative;}
.hbtn{background:var(--card2);border:1px solid var(--border);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 0.15s,border-color 0.15s;color:var(--ink2);}
.hbtn:hover,.hbtn.active{background:var(--gold-bg);border-color:var(--gold-border);color:var(--gold);}

/* HAMBURGER DROPDOWN */
.hamburger-menu{position:absolute;top:calc(100% + 0.5rem);right:0;width:240px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);overflow:hidden;z-index:200;display:none;animation:fadeDown 0.15s ease;}
@keyframes fadeDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.hamburger-menu.open{display:block;}
.hm-user{padding:0.85rem 1rem;border-bottom:1px solid var(--border);}
.hm-user-email{font-size:0.82rem;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:0.15rem;}
.hm-signed-in{font-size:0.72rem;color:var(--ink3);}
.hm-item{display:flex;align-items:center;gap:0.65rem;padding:0.75rem 1rem;font-size:0.88rem;color:var(--ink2);cursor:pointer;transition:background 0.15s;border:none;background:none;width:100%;font-family:'Inter',sans-serif;font-weight:500;text-align:left;}
.hm-item:hover{background:var(--bg2);}
.hm-item svg{flex-shrink:0;color:var(--ink3);}
.hm-item.danger{color:var(--red);}
.hm-item.danger svg{color:var(--red);}
.hm-divider{height:1px;background:var(--border);}

/* SEARCH */
.search-wrap{margin:0.75rem 1.5rem 0;position:relative;}
.search-wrap input{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:50px;padding:0.65rem 1rem 0.65rem 2.6rem;font-family:'Inter',sans-serif;font-size:16px;color:var(--ink);outline:none;transition:border-color 0.2s,box-shadow 0.2s;box-shadow:var(--shadow-sm);}
.search-wrap input::placeholder{color:var(--ink3);}
.search-wrap input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(196,154,42,0.12);}
.search-icon{position:absolute;left:0.9rem;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none;}

/* SCROLL */
.scroll-area{flex:1;overflow-y:auto;padding:1.5rem 1.5rem calc(80px + env(safe-area-inset-bottom) + 1.5rem);}

/* FLOATING PILL NAV */
.bottom-nav{position:fixed;bottom:calc(1.25rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:360px;background:var(--card);border:1px solid var(--border);border-radius:50px;display:flex;align-items:center;justify-content:space-around;z-index:50;box-shadow:0 8px 32px rgba(0,0,0,0.15),0 2px 8px rgba(0,0,0,0.08);height:58px;padding:0 0.5rem;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.22rem;cursor:pointer;padding:0.5rem 0;border:none;background:none;color:var(--ink3);font-family:'Inter',sans-serif;font-size:0.6rem;font-weight:500;letter-spacing:0.02em;transition:color 0.15s;position:relative;border-radius:50px;}
.nav-item.active{color:var(--gold);}
.nav-item.active::after{content:'';position:absolute;top:0;left:15%;right:15%;height:2.5px;background:var(--gold);border-radius:0 0 3px 3px;}
.nav-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;transition:transform 0.2s;}
.nav-item.active .nav-icon{transform:scale(1.15);}
.nav-label{line-height:1;}
.nav-item.center-btn{background:var(--gold);color:#fff !important;border-radius:50%;width:44px;height:44px;flex:none;box-shadow:0 4px 12px rgba(196,154,42,0.5);font-size:0;padding:0;gap:0;}
.nav-item.center-btn::after{display:none;}
.nav-item.center-btn .nav-icon{color:#fff;transform:none;}
.nav-item.center-btn:hover{filter:brightness(1.1);}

/* FILTER */
.filter-row{display:flex;gap:0.6rem;margin-bottom:1.1rem;flex-wrap:wrap;}
.filter-pill{display:flex;align-items:center;gap:0.4rem;background:var(--card);border:1.5px solid var(--border);border-radius:50px;padding:0.4rem 0.9rem;font-family:'Inter',sans-serif;font-size:0.78rem;font-weight:500;color:var(--ink2);cursor:pointer;box-shadow:var(--shadow-sm);transition:border-color 0.15s,background 0.15s;position:relative;}
.filter-pill.has-filter{border-color:var(--gold);background:var(--gold-bg);color:var(--gold);font-weight:600;}
.filter-pill select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;border:none;background:none;font-size:1rem;}
.filter-arrow{font-size:0.65rem;opacity:0.6;}

/* PAGE TITLES */
.page-title{font-family:'Lora',serif;font-size:1.5rem;font-weight:700;color:var(--ink);margin-bottom:0.25rem;}
.page-sub{font-size:0.8rem;color:var(--ink3);margin-bottom:1.25rem;}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.85rem;margin-top:0.25rem;}
.sec-title{font-size:0.72rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);}

/* TODAY */
.daily-greeting{margin-bottom:1.25rem;}
.greeting-label{font-size:0.72rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:0.2rem;}
.greeting-date{font-family:'Lora',serif;font-size:1.3rem;font-weight:600;color:var(--ink);}
.today-grid{display:flex;flex-direction:column;gap:1rem;}
.today-left,.today-right{display:flex;flex-direction:column;gap:1rem;}

/* DAILY CARD */
.verse-hero{background:linear-gradient(145deg,#FBF5E0 0%,#F0E8C8 60%,#EAE0B8 100%);border:1px solid var(--gold-border);border-radius:var(--radius-lg);padding:2rem 1.75rem 1.75rem;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;}
.dark .verse-hero{background:linear-gradient(145deg,#2A2210 0%,#221A08 100%);}
.verse-hero::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:radial-gradient(circle,rgba(196,154,42,0.12) 0%,transparent 70%);border-radius:50%;}
.vh-label{font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:0.75rem;}
.vh-cat{display:inline-flex;align-items:center;background:rgba(196,154,42,0.12);border:1px solid var(--gold-border);border-radius:20px;padding:0.25rem 0.75rem;font-size:0.68rem;font-weight:600;color:var(--gold);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:1.25rem;}
.vh-text{font-family:'Lora',serif;font-size:1.1rem;line-height:1.75;color:var(--ink);font-style:italic;font-weight:400;margin-bottom:1.5rem;}
.vh-footer{display:flex;align-items:center;justify-content:space-between;}
.vh-ref{font-size:0.78rem;font-weight:700;color:var(--gold);letter-spacing:0.08em;text-transform:uppercase;}
.vh-actions{display:flex;align-items:center;gap:0.5rem;}
.icon-circle{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink3);box-shadow:var(--shadow-sm);transition:all 0.15s;}
.icon-circle:hover{transform:scale(1.1);}
.icon-circle.fav.active{background:rgba(160,48,32,0.08);border-color:rgba(160,48,32,0.2);color:var(--red);}
.icon-circle.vow.active{background:rgba(26,90,138,0.08);border-color:rgba(26,90,138,0.2);color:var(--blue);}

/* VOW CARD */
.vow-card{background:linear-gradient(145deg,#EDF4FA 0%,#E0EDF7 100%);border:1px solid #B8D4E8;border-radius:var(--radius-lg);padding:1.5rem 1.5rem 1.4rem;box-shadow:var(--shadow-md);position:relative;overflow:hidden;}
.dark .vow-card{background:linear-gradient(145deg,#0E1A24 0%,#0A1420 100%);border-color:#1A3A52;}
.vow-card::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;background:radial-gradient(circle,rgba(26,90,138,0.1) 0%,transparent 70%);border-radius:50%;}
.vow-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.85rem;}
.vow-label{font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--blue);opacity:0.8;}
.vow-empty{text-align:center;padding:0.5rem 0 0.25rem;}
.vow-empty-text{font-size:0.88rem;color:var(--ink3);margin-bottom:0.85rem;line-height:1.5;}
.vow-set-btn{display:inline-flex;align-items:center;gap:0.4rem;background:var(--blue);color:#fff;border:none;border-radius:50px;padding:0.55rem 1.1rem;font-family:'Inter',sans-serif;font-size:0.8rem;font-weight:600;cursor:pointer;transition:filter 0.15s;}
.vow-set-btn:hover{filter:brightness(1.1);}
.vow-cat{display:inline-flex;background:rgba(26,90,138,0.1);border:1px solid rgba(26,90,138,0.2);border-radius:20px;padding:0.2rem 0.65rem;font-size:0.65rem;font-weight:600;color:var(--blue);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:0.85rem;}
.vow-text{font-family:'Lora',serif;font-size:0.95rem;line-height:1.7;color:var(--ink);font-style:italic;margin-bottom:1rem;}
.vow-footer{display:flex;align-items:center;justify-content:space-between;}
.vow-ref{font-size:0.72rem;font-weight:700;color:var(--blue);letter-spacing:0.06em;text-transform:uppercase;opacity:0.8;}

/* STATS */
.quick-stats{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow-sm);}
.stat-num{font-family:'Lora',serif;font-size:1.6rem;font-weight:700;color:var(--gold);line-height:1;margin-bottom:0.25rem;}
.stat-label{font-size:0.72rem;color:var(--ink3);font-weight:500;}

/* VERSE CARDS */
.verse-grid{display:grid;grid-template-columns:1fr;gap:0.75rem;}
.verse-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.2rem;box-shadow:var(--shadow-sm);transition:box-shadow 0.2s,transform 0.15s;display:flex;flex-direction:column;}
.verse-card:active{transform:scale(0.99);}
.vc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.5rem;gap:0.5rem;}
.vc-ref{font-size:0.72rem;font-weight:700;color:var(--gold);letter-spacing:0.06em;text-transform:uppercase;}
.vc-cat{font-size:0.62rem;font-weight:600;background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border);border-radius:6px;padding:0.15rem 0.45rem;letter-spacing:0.04em;white-space:nowrap;}
.vc-text{font-family:'Lora',serif;font-size:0.9rem;line-height:1.6;color:var(--ink2);font-style:italic;margin-bottom:0.75rem;flex:1;}
.vc-bottom{display:flex;justify-content:flex-end;align-items:center;gap:0.4rem;margin-top:auto;}
.ic-btn{background:none;border:none;cursor:pointer;color:var(--ink3);padding:0.2rem;transition:color 0.15s,transform 0.1s;display:flex;align-items:center;}
.ic-btn:hover{transform:scale(1.2);}
.ic-btn.fav.active{color:var(--red);}
.ic-btn.vow.active{color:var(--blue);}
.ic-btn.note.active{color:var(--green);}

/* MANAGE CATEGORIES */
.cat-list{display:flex;flex-direction:column;gap:0.5rem;max-height:50vh;overflow-y:auto;}
.cat-item{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.75rem 1rem;}
.cat-item-name{font-size:0.9rem;color:var(--ink);font-weight:500;}
.cat-item-actions{display:flex;gap:0.35rem;}
.cat-action-btn{background:none;border:none;cursor:pointer;color:var(--ink3);padding:0.25rem;border-radius:6px;transition:color 0.15s,background 0.15s;display:flex;align-items:center;}
.cat-action-btn:hover{background:var(--bg2);}
.cat-action-btn.edit:hover{color:var(--gold);}
.cat-action-btn.del:hover{color:var(--red);}
.cat-edit-row{display:flex;gap:0.5rem;align-items:center;flex:1;}
.cat-edit-input{flex:1;background:var(--card);border:1.5px solid var(--gold);border-radius:var(--radius-sm);padding:0.4rem 0.7rem;font-family:'Inter',sans-serif;font-size:0.88rem;color:var(--ink);outline:none;}

/* SKELETONS */
.skeleton{background:linear-gradient(90deg,var(--card2) 25%,var(--border) 50%,var(--card2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-hero{height:260px;border-radius:var(--radius-lg);}
.skel-vow{height:180px;border-radius:var(--radius-lg);}
.skel-stat{height:80px;border-radius:var(--radius);}
.skel-card{height:120px;border-radius:var(--radius);}

/* ACTION MENU */
.action-choice{display:flex;flex-direction:column;gap:0.75rem;padding:0.25rem 0 0.5rem;}
.choice-btn{display:flex;align-items:center;gap:0.85rem;background:var(--card2);border:1.5px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;cursor:pointer;transition:all 0.15s;font-family:'Inter',sans-serif;text-align:left;width:100%;}
.choice-btn:hover{border-color:var(--gold);background:var(--gold-bg);}
.choice-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.choice-title{font-size:0.9rem;font-weight:600;color:var(--ink);margin-bottom:0.15rem;}
.choice-sub{font-size:0.75rem;color:var(--ink3);}

/* AUTH */
.auth-wrap{padding:2rem 1.5rem;max-width:480px;margin:0 auto;}
.auth-hero{text-align:center;margin-bottom:2rem;}
.auth-logo{font-family:'Lora',serif;font-size:2.5rem;font-weight:700;color:var(--gold);font-style:italic;margin-bottom:0.5rem;}
.auth-logo span{color:var(--red);font-style:normal;}
.auth-tagline{font-size:0.88rem;color:var(--ink3);line-height:1.5;}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.75rem 1.5rem;box-shadow:var(--shadow-md);}
.auth-card-title{font-family:'Lora',serif;font-size:1.2rem;font-weight:700;color:var(--ink);margin-bottom:0.25rem;}
.auth-card-sub{font-size:0.82rem;color:var(--ink3);margin-bottom:1.5rem;}
.auth-field{margin-bottom:1rem;}
.auth-label{display:block;font-size:0.72rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:0.4rem;}
.auth-input{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:0.75rem 1rem;font-family:'Inter',sans-serif;font-size:16px;color:var(--ink);outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
.auth-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(196,154,42,0.12);}
.auth-btn{width:100%;margin-top:0.5rem;background:var(--gold);color:#fff;border:none;border-radius:50px;padding:0.9rem;font-family:'Inter',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer;letter-spacing:0.02em;box-shadow:0 4px 16px rgba(196,154,42,0.35);transition:filter 0.15s,transform 0.1s;}
.auth-btn:hover{filter:brightness(1.08);}
.auth-btn:active{transform:scale(0.98);}
.auth-btn:disabled{opacity:0.55;cursor:not-allowed;}
.auth-error{margin-top:0.85rem;padding:0.6rem 0.9rem;background:rgba(160,48,32,0.07);border:1px solid rgba(160,48,32,0.2);border-radius:8px;font-size:0.82rem;color:var(--red);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(10,8,4,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:1.5rem 1.5rem 2.5rem;width:100%;max-width:560px;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto;}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 1.25rem;}
.modal-title{font-family:'Lora',serif;font-size:1.15rem;font-weight:700;color:var(--ink);margin-bottom:1.25rem;}
.modal label{display:block;font-size:0.72rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:0.4rem;margin-top:1rem;}
.modal label:first-of-type{margin-top:0;}
.modal input,.modal textarea,.modal select{width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:0.7rem 0.9rem;font-family:'Inter',sans-serif;font-size:16px;color:var(--ink);outline:none;transition:border-color 0.2s;resize:vertical;}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(196,154,42,0.1);}
.modal textarea{min-height:90px;}
.modal-actions{display:flex;gap:0.75rem;margin-top:1.5rem;}
.btn{font-family:'Inter',sans-serif;font-size:0.88rem;font-weight:600;padding:0.7rem 1.25rem;border-radius:50px;border:none;cursor:pointer;transition:all 0.15s;flex:1;}
.btn-primary{background:var(--gold);color:#fff;box-shadow:0 2px 8px rgba(196,154,42,0.3);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;}
.btn-ghost{background:var(--card2);border:1.5px solid var(--border);color:var(--ink2);}
.btn-ghost:hover{background:var(--bg2);}
.btn-danger{background:rgba(160,48,32,0.08);border:1.5px solid rgba(160,48,32,0.2);color:var(--red);}
.btn-danger:hover{background:rgba(160,48,32,0.15);}
.new-cat-row{display:flex;gap:0.5rem;align-items:center;margin-top:0.5rem;}
.new-cat-row input{flex:1;margin:0;}

/* PICKER */
.picker-search{margin-bottom:1rem;}
.picker-search-wrap{position:relative;}

.picker-search-wrap input:focus{border-color:var(--gold);}

.picker-item{background:var(--card2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:0.85rem 1rem;cursor:pointer;transition:all 0.15s;}
.picker-item:hover{border-color:var(--gold);background:var(--gold-bg);}
.picker-item-ref{font-size:0.72rem;font-weight:700;color:var(--gold);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:0.3rem;}
.picker-item-text{font-family:'Lora',serif;font-size:0.88rem;line-height:1.55;color:var(--ink2);font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* CONFIRM */

.confirm-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.75rem 1.5rem;width:100%;max-width:340px;box-shadow:var(--shadow-lg);}

/* EMPTY / TOAST */

<script>
const SUPA_URL = "https://lbdjclsoayhnesavsnam.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiZGpjbHNvYXlobmVzYXZzbmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NzY0ODIsImV4cCI6MjA5NzI1MjQ4Mn0.Kk1OPpRfot2TetIf-GzSexnYsmHpuyWxT2r2BfsR62A";
const UNCATEGORIZED_ID = "aa875755-1059-4492-ab06-0ed4de529e96";
const { createClient } = supabase;
const db = createClient(SUPA_URL, SUPA_KEY);

// CANONICAL BIBLE ORDER
const BIBLE_ORDER = ["Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth","1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther","Job","Psalms","Psalm","Proverbs","Ecclesiastes","Song of Solomon","Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi","Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation"];

function bookOrder(b) {
  const i = BIBLE_ORDER.findIndex(x => x.toLowerCase() === b.toLowerCase());
  return i === -1 ? 999 : i;
}
function parseRef(ref) {
  const m = ref.match(/^(.+?)\s+(\d+)(?::(\d+))?$/);
  if (!m) return { book: ref, ch: 0, vs: 0 };
  return { book: m[1].trim(), ch: parseInt(m[2]) || 0, vs: parseInt(m[3]) || 0 };
}
function sortCanonical(arr) {
  return [...arr].sort((a, b) => {
    const pa = parseRef(a.ref), pb = parseRef(b.ref);
    const bo = bookOrder(pa.book) - bookOrder(pb.book);
    if (bo !== 0) return bo;
    if (pa.ch !== pb.ch) return pa.ch - pb.ch;
    return pa.vs - pb.vs;
  });
}

// STATE
let currentUser = null;
let verses = [], categories = [], favIds = [], notesMap = {};
let vowData = null;
let isDark = localStorage.getItem("seed_dark") === "true";
let searchVisible = false, searchQuery = "", selectedCat = "All", selectedBook = "All", currentView = "daily";
let confirmResolve = null, activeVerse = null, activeNoteVerse = null;

if (isDark) document.body.classList.add("dark");

// HELPERS
function hideSplash() {
  const s = document.getElementById("splash");
  if (s) { s.classList.add("hidden"); setTimeout(() => s.remove(), 500); }
}
function sanitize(str) {
  if (!str) return "";
  const el = document.createElement("div");
  el.textContent = String(str);
  return el.innerHTML;
}
function sanitizeInput(str) {
  if (!str) return "";
  return String(str).replace(/<[^>]*>/g, "").replace(/javascript:/gi, "").replace(/on\w+\s*=/gi, "").trim();
}
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("show"), 2500);
}
function getBook(ref) { return ref.replace(/\s+\d.*$/, "").trim(); }
function getWeekNumber() {
  const d = new Date();
  const s = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  s.setUTCDate(s.getUTCDate() + 4 - (s.getUTCDay() || 7));
  const y = new Date(Date.UTC(s.getUTCFullYear(), 0, 1));
  return { week: Math.ceil((((s - y) / 86400000) + 1) / 7), year: s.getUTCFullYear() };
}
function getCatName(catId) {
  const c = categories.find(x => x.id === catId);
  return c ? c.name : "Uncategorized";
}
function isFav(v) { return favIds.includes(v.id); }
function hasNote(v) { return !!notesMap[v.id]; }
function getNote(v) { return notesMap[v.id] || null; }
function getBooks() {
  const books = [...new Set(verses.map(v => getBook(v.ref)))];
  books.sort((a, b) => { const bo = bookOrder(a) - bookOrder(b); return bo !== 0 ? bo : a.localeCompare(b); });
  return ["All", ...books];
}
function getVowVerse() {
  if (!vowData) return null;
  const { week, year } = getWeekNumber();
  if (vowData.week_number !== week || vowData.year !== year) return null;
  return verses.find(v => v.id === vowData.base_verse_id) || null;
}
function isCurrentVow(v) {
  if (!vowData) return false;
  const { week, year } = getWeekNumber();
  if (vowData.week_number !== week || vowData.year !== year) return false;
  return vowData.base_verse_id === v.id;
}

// LOAD DATA
async function loadData() {
  const { week, year } = getWeekNumber();
  const [catRes, verseRes, favRes, vowRes, noteRes] = await Promise.all([
    db.from("categories").select("id,name").order("name"),
    db.from("verses").select("id,ref,text,cat_id,translation").order("ref"),
    db.from("favorites").select("id,base_verse_id").eq("user_id", currentUser.id),
    db.from("verse_of_week").select("*").eq("user_id", currentUser.id).eq("week_number", week).eq("year", year).maybeSingle(),
    db.from("notes").select("id,base_verse_id,note").eq("user_id", currentUser.id),
  ]);
  categories = catRes.data || [];
  verses = (verseRes.data || []).map(v => ({ ...v, cat: getCatName(v.cat_id) }));
  favIds = (favRes.data || []).map(f => f.base_verse_id);
  vowData = vowRes.data || null;
  notesMap = {};
  (noteRes.data || []).forEach(n => { if (n.base_verse_id) notesMap[n.base_verse_id] = n; });
}
async function loadDataSafe() {
  const timeout = new Promise(r => setTimeout(r, 6000));
  await Promise.race([loadData(), timeout]);
}

// FAVORITES
async function toggleFav(id) {
  if (isFav({ id })) {
    const { error } = await db.from("favorites").delete().eq("user_id", currentUser.id).eq("base_verse_id", id);
    if (error) { showToast("Error removing from Saved."); return; }
    favIds = favIds.filter(x => x !== id);
    showToast("Removed from Saved.");
  } else {
    const { data, error } = await db.from("favorites").insert({ user_id: currentUser.id, base_verse_id: id }).select().single();
    if (error || !data) { showToast("Error saving verse."); return; }
    favIds.push(id);
    showToast("Saved!");
  }
  render();
}

// VERSE OF WEEK
async function setVow(id) {
  const { week, year } = getWeekNumber();
  const row = { user_id: currentUser.id, week_number: week, year, base_verse_id: id };
  if (vowData) {
    const { data, error } = await db.from("verse_of_week").update(row).eq("id", vowData.id).select().single();
    if (error || !data) { showToast("Error setting Verse of the Week."); return; }
    vowData = data;
  } else {
    const { data, error } = await db.from("verse_of_week").insert(row).select().single();
    if (error || !data) { showToast("Error setting Verse of the Week."); return; }
    vowData = data;
  }
  showToast("Verse of the Week set!");
  closeVowPicker();
  render();
}
async function setVowById(id) {
  const existing = getVowVerse();
  if (existing && existing.id !== id) {
    const v = verses.find(x => x.id === id);
    const ok = await showConfirm("Replace Verse of the Week?", `"${v ? v.ref : ""}" will replace your current verse of the week.`, "Replace");
    if (!ok) return;
  }
  await setVow(id);
}

// CONFIRM
function showConfirm(title, text, okLabel = "Confirm") {
  return new Promise(resolve => {
    confirmResolve = resolve;
    document.getElementById("confirmTitle").textContent = title;
    document.getElementById("confirmText").textContent = text;
    document.getElementById("confirmOkBtn").textContent = okLabel;
    document.getElementById("confirmOverlay").style.display = "flex";
  });
}
function resolveConfirm(val) {
  document.getElementById("confirmOverlay").style.display = "none";
  if (confirmResolve) { confirmResolve(val); confirmResolve = null; }
}

// DAILY VERSE
function getDailyVerse() {
  if (!verses.length) return null;
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const day = Math.floor((now - start) / 86400000);
  return verses[((now.getFullYear() * 1000) + day) % verses.length];
}

function renderVowPicker(query) {
  var list = sortCanonical(verses);
  if (query) {
    var q = query.toLowerCase();
    list = list.filter(function(v) { return v.ref.toLowerCase().indexOf(q) >= 0 || v.text.toLowerCase().indexOf(q) >= 0 || v.cat.toLowerCase().indexOf(q) >= 0; });
  }
  var el = document.getElementById("vowPickerList");
  if (!list.length) { el.innerHTML = '<div class="empty">No verses found.</div>'; return; }
  el.innerHTML = list.map(function(v) {
    return '<div class="picker-item" onclick="setVowById(\'' + v.id + '\')">' +
      '<div class="picker-item-ref">' + sanitize(v.ref) + ' &middot; ' + sanitize(v.cat) + '</div>' +
      '<div class="picker-item-text">' + sanitize(v.text) + '</div>' +
    '</div>';
  }).join("");
}

function closeEditVerse() { document.getElementById("editVerseOverlay").style.display = "none"; }
async function saveEditVerse(id) {
  var refEl = document.getElementById("editVerseRef");
  var textEl = document.getElementById("editVerseText");
  var msg = document.getElementById("editVerseMsg");
  var btn = document.getElementById("editVerseSaveBtn");
  var ref = sanitizeInput(refEl.value.trim());
  var text = sanitizeInput(textEl.value.trim());
  if (!ref) { msg.innerHTML = '<div class="modal-error">Enter a reference.</div>'; return; }
  if (!text) { msg.innerHTML = '<div class="modal-error">Enter the verse text.</div>'; return; }
  var origVerse = verses.find(function(x) { return x.id === id; });
  var origRef = origVerse ? origVerse.ref : "";
  if (ref.toLowerCase() !== origRef.toLowerCase()) {
    var { data: dup } = await db.from("verses").select("id").ilike("ref", ref).neq("id", id).maybeSingle();
    if (dup) { msg.innerHTML = '<div class="modal-error">"' + sanitize(ref) + '" already exists.</div>'; return; }
  }
  btn.disabled = true; btn.textContent = "Saving...";
  var { data, error } = await db.from("verses").update({ ref: ref, text: text }).eq("id", id).select().single();
  if (error || !data) { msg.innerHTML = '<div class="modal-error">Error saving verse. Please try again.</div>'; btn.disabled = false; btn.textContent = "Save"; return; }
  var v = verses.find(function(x) { return x.id === id; });
  if (v) { v.ref = ref; v.text = text; }
  btn.disabled = false;
  closeEditVerse();
  showToast("Verse updated.");
  render();
}

// DELETE VERSE
async function deleteVerse() {
  var v = activeVerse;
  closeActionMenu();
  if (!v) return;
  var ok = await showConfirm("Delete Verse?", '"' + v.ref + '" will be permanently deleted.', "Delete");
  if (!ok) return;
  var { error } = await db.from("verses").delete().eq("id", v.id);
  if (error) { showToast("Error deleting verse. Please try again."); return; }
  verses = verses.filter(function(x) { return x.id !== v.id; });
  showToast("Verse deleted.");
  render();
}

async function addCategoryInModal() {

}

async function saveVerse() {
  var ref = sanitizeInput(document.getElementById("newRef").value.trim());
  var text = sanitizeInput(document.getElementById("newText").value.trim());
  var catId = document.getElementById("newCat").value;
  var msg = document.getElementById("verseMsg");
  var btn = document.getElementById("saveVerseBtn");
  msg.innerHTML = "";
  if (!ref) { msg.innerHTML = '<div class="modal-error">Enter a verse reference.</div>'; return; }
  if (!text) { msg.innerHTML = '<div class="modal-error">Enter the verse text.</div>'; return; }
  if (!catId) { msg.innerHTML = '<div class="modal-error">Select a category.</div>'; return; }
  btn.disabled = true; btn.textContent = "Checking...";
  var { data: dup } = await db.from("verses").select("id").ilike("ref", ref).maybeSingle();
  if (dup) { msg.innerHTML = '<div class="modal-error">"' + sanitize(ref) + '" already exists.</div>'; btn.disabled = false; btn.textContent = "Save Verse"; return; }
  btn.textContent = "Saving...";
  var { data, error } = await db.from("verses").insert({ ref: ref, text: text, cat_id: catId, translation: "NKJV" }).select().single();
  if (error || !data) { msg.innerHTML = '<div class="modal-error">Error saving verse. Please try again.</div>'; btn.disabled = false; btn.textContent = "Save Verse"; return; }
  verses.push(Object.assign({}, data, { cat: getCatName(catId) }));
  btn.disabled = false;
  closeModal();
  showToast('"' + ref + '" added.');
  render();
}

    body.innerHTML =
      '<div class="note-ref-label">' + sanitize(v.ref) + '</div>' +
      '<textarea id="noteInput" placeholder="Write your note here..." maxlength="2000" style="min-height:120px;margin-top:0.5rem;width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:0.7rem 0.9rem;font-family:\'Inter\',sans-serif;font-size:16px;color:var(--ink);outline:none;resize:vertical;"></textarea>' +
      '<div id="noteMsgArea"></div>' +
      '<div class="modal-actions"><button class="btn btn-ghost" onclick="closeNoteModal()">Cancel</button><button class="btn btn-primary" onclick="saveNote()">Save</button></div>';
    setTimeout(function() { var el = document.getElementById("noteInput"); if (el) el.focus(); }, 100);
  }
}
function switchToEditNote() {
  var existing = getNote(activeNoteVerse);
  document.getElementById("noteModalTitle").textContent = "Edit Note";
  document.getElementById("noteModalBody").innerHTML =
    '<div class="note-ref-label">' + sanitize(activeNoteVerse.ref) + '</div>' +
    '<textarea id="noteInput" maxlength="2000" style="min-height:120px;margin-top:0.5rem;width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:0.7rem 0.9rem;font-family:\'Inter\',sans-serif;font-size:16px;color:var(--ink);outline:none;resize:vertical;">' + sanitize(existing ? existing.note : "") + '</textarea>' +
    '<div id="noteMsgArea"></div>' +
    '<div class="modal-actions"><button class="btn btn-ghost" onclick="closeNoteModal()">Cancel</button><button class="btn btn-primary" onclick="saveNote()">Save</button></div>';
  setTimeout(function() { var el = document.getElementById("noteInput"); if (el) el.focus(); }, 100);
}
async function saveNote() {
  var input = document.getElementById("noteInput");
  var msgArea = document.getElementById("noteMsgArea");
  if (!input || !activeNoteVerse) return;
  var noteText = sanitizeInput(input.value.trim());
  if (!noteText) { msgArea.innerHTML = '<div class="modal-error">Please enter a note.</div>'; return; }
  if (noteText.length > 2000) { msgArea.innerHTML = '<div class="modal-error">Note must be 2000 characters or less.</div>'; return; }
  var existing = getNote(activeNoteVerse);
  var v = activeNoteVerse;
  if (existing) {
    var { data, error } = await db.from("notes").update({ note: noteText }).eq("id", existing.id).select().single();
    if (error || !data) { msgArea.innerHTML = '<div class="modal-error">Error saving note. Please try again.</div>'; return; }
    notesMap[v.id] = data;
  } else {
    var { data, error } = await db.from("notes").insert({ user_id: currentUser.id, note: noteText, base_verse_id: v.id }).select().single();
    if (error || !data) { msgArea.innerHTML = '<div class="modal-error">Error saving note. Please try again.</div>'; return; }
    notesMap[v.id] = data;
  }
  closeNoteModal();
  showToast("Note saved.");
  render();
}
async function deleteNote() {
  var v = activeNoteVerse;
  var existing = getNote(v);
  if (!existing) return;
  var { error } = await db.from("notes").delete().eq("id", existing.id);
  if (error) { showToast("Error deleting note. Please try again."); return; }
  delete notesMap[v.id];
  closeNoteModal();
  showToast("Note deleted.");
  render();
}
document.getElementById("noteModalOverlay").addEventListener("click", function(e) { if (e.target === document.getElementById("noteModalOverlay")) closeNoteModal(); });

// MANAGE CATEGORIES
function openManageCategories() {
  closeHamburger();
  renderManageCats();
  document.getElementById("manageCatsOverlay").style.display = "flex";
}
function closeManageCategories() { document.getElementById("manageCatsOverlay").style.display = "none"; }
function renderManageCats() {
  var body = document.getElementById("manageCatsBody");
  var html = '<div class="cat-list">';
  categories.forEach(function(c) {
    var isUncat = c.id === UNCATEGORIZED_ID;
    html += '<div class="cat-item" id="catrow-' + c.id + '">' +
      '<span class="cat-item-name">' + sanitize(c.name) + (isUncat ? ' <span style="font-size:0.65rem;color:var(--ink3);">(default)</span>' : '') + '</span>';
    if (isUncat) {
      html += '<span style="font-size:0.65rem;color:var(--ink3);">Default</span>';
    } else {
      html += '<div class="cat-item-actions">' +
        '<button class="cat-action-btn edit" onclick="startEditCat(\'' + c.id + '\',\'' + c.name.replace(/\\/g, "\\\\").replace(/'/g, "\\'") + '\')">' + editIcon + '</button>' +
        '<button class="cat-action-btn del" onclick="deleteCat(\'' + c.id + '\',\'' + c.name.replace(/\\/g, "\\\\").replace(/'/g, "\\'") + '\')">' + trashIcon + '</button>' +
      '</div>';
    }
    html += '</div>';
  });
  html += '</div>' +
    '<div style="margin-top:1rem;">' +
      '<div style="font-size:0.72rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:0.5rem;">Add a new category</div>' +
      '<div class="new-cat-row">' +
        '<input type="text" id="manageCatNewInput" placeholder="Category name..." maxlength="50" style="flex:1;background:var(--card2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:0.65rem 0.85rem;font-family:\'Inter\',sans-serif;font-size:16px;color:var(--ink);outline:none;">' +
        '<button class="btn btn-primary" style="flex:none;padding:0.65rem 1rem;font-size:0.8rem;white-space:nowrap;" onclick="addCatFromManage()">Add</button>' +
      '</div>' +
      '<div id="manageCatMsg"></div>' +
    '</div>' +
    '<div class="modal-actions" style="margin-top:1rem;"><button class="btn btn-ghost" onclick="closeManageCategories()">Done</button></div>';
  body.innerHTML = html;
}
function startEditCat(id, currentName) {
  var row = document.getElementById("catrow-" + id);
  if (!row) return;
  row.innerHTML =
    '<div class="cat-edit-row">' +
      '<input class="cat-edit-input" type="text" id="editCatInput-' + id + '" value="' + sanitize(currentName) + '" maxlength="50">' +
      '<button class="btn btn-primary" style="flex:none;padding:0.4rem 0.8rem;font-size:0.8rem;" onclick="saveEditCat(\'' + id + '\')">Save</button>' +
      '<button class="btn btn-ghost" style="flex:none;padding:0.4rem 0.8rem;font-size:0.8rem;" onclick="renderManageCats()">Cancel</button>' +
    '</div>';
}
async function saveEditCat(id) {
  var input = document.getElementById("editCatInput-" + id);
  var name = sanitizeInput(input.value.trim());
  var msg = document.getElementById("manageCatMsg");
  msg.innerHTML = "";
  if (!name) { msg.innerHTML = '<div class="modal-error">Enter a category name.</div>'; return; }
  var { data: dup } = await db.from("categories").select("id").ilike("name", name).neq("id", id).maybeSingle();
  if (dup) { msg.innerHTML = '<div class="modal-error">"' + sanitize(name) + '" already exists.</div>'; return; }
  var { data, error } = await db.from("categories").update({ name: name }).eq("id", id).select().single();
  if (error || !data) { msg.innerHTML = '<div class="modal-error">Error updating category. Please try again.</div>'; return; }
  var cat = categories.find(function(c) { return c.id === id; });
  if (cat) cat.name = name;
  verses = verses.map(function(v) { return v.cat_id === id ? Object.assign({}, v, { cat: name }) : v; });
  showToast('Category renamed to "' + name + '".');
  renderManageCats();
  render();
}
async function deleteCat(id, name) {
  var ok = await showConfirm('Delete "' + name + '"?', "All verses in this category will move to Uncategorized.", "Delete");
  if (!ok) return;
  var { error } = await db.from("categories").delete().eq("id", id);
  if (error) { showToast("Error deleting category. Please try again."); return; }
  categories = categories.filter(function(c) { return c.id !== id; });
  verses = verses.map(function(v) { return v.cat_id === id ? Object.assign({}, v, { cat: "Uncategorized", cat_id: UNCATEGORIZED_ID }) : v; });
  showToast('"' + name + '" deleted.');
  renderManageCats();
  render();
}
async function addCatFromManage() {
  var input = document.getElementById("manageCatNewInput");
  var name = sanitizeInput(input.value.trim());
  var msg = document.getElementById("manageCatMsg");
  msg.innerHTML = "";
  if (!name) { msg.innerHTML = '<div class="modal-error">Enter a category name.</div>'; return; }
  var { data: dup } = await db.from("categories").select("id").ilike("name", name).maybeSingle();
  if (dup) { msg.innerHTML = '<div class="modal-error">"' + sanitize(name) + '" already exists.</div>'; return; }
  var { data, error } = await db.from("categories").insert({ name: name, is_base: false }).select().single();
  if (error || !data) { msg.innerHTML = '<div class="modal-error">Error saving category. Please try again.</div>'; return; }
  categories.push(data);
  input.value = "";
  showToast('"' + name + '" added.');
  renderManageCats();
}
document.getElementById("manageCatsOverlay").addEventListener("click", function(e) { if (e.target === document.getElementById("manageCatsOverlay")) closeManageCategories(); });

// FILTER ROW
function filterRowHTML() {
  var cats = ["All"].concat(categories.map(function(c) { return c.name; }));
  var books = getBooks();
  var catActive = selectedCat !== "All";
  var bookActive = selectedBook !== "All";
  var catOpts = cats.map(function(c) { return '<option value="' + c.replace(/"/g, "&quot;") + '" ' + (selectedCat === c ? "selected" : "") + '>' + sanitize(c) + '</option>'; }).join("");
  var bookOpts = books.map(function(b) { return '<option value="' + b.replace(/"/g, "&quot;") + '" ' + (selectedBook === b ? "selected" : "") + '>' + sanitize(b) + '</option>'; }).join("");
  return '<div class="filter-row">' +
    '<div class="filter-pill ' + (catActive ? "has-filter" : "") + '">' +
      (catActive ? sanitize(selectedCat) : "Category") + ' <span class="filter-arrow">&#9660;</span>' +
      '<select onchange="selectCat(this.value)">' + catOpts + '</select>' +
    '</div>' +
    '<div class="filter-pill ' + (bookActive ? "has-filter" : "") + '">' +
      (bookActive ? sanitize(selectedBook) : "Book") + ' <span class="filter-arrow">&#9660;</span>' +
      '<select onchange="selectBook(this.value)">' + bookOpts + '</select>' +
    '</div>' +
  '</div>';
}
function selectCat(v) { selectedCat = v; render(); }
function selectBook(v) { selectedBook = v; render(); }
function getFiltered(list) {
  if (selectedCat !== "All") list = list.filter(function(v) { return v.cat === selectedCat; });
  if (selectedBook !== "All") list = list.filter(function(v) { return getBook(v.ref) === selectedBook; });
  if (searchQuery) {
    var q = searchQuery.toLowerCase();
    list = list.filter(function(v) { return v.ref.toLowerCase().indexOf(q) >= 0 || v.text.toLowerCase().indexOf(q) >= 0 || v.cat.toLowerCase().indexOf(q) >= 0; });
  }
  return list;
}

// VERSE CARD
function renderVerseCard(v) {
  var favd = isFav(v);
  var vowActive = isCurrentVow(v);
  var noted = hasNote(v);
  return '<div class="verse-card">' +
    '<div class="vc-top"><div class="vc-ref">' + sanitize(v.ref) + '</div><span class="vc-cat">' + sanitize(v.cat) + '</span></div>' +
    '<div class="vc-text">' + sanitize(v.text) + '</div>' +
    '<div class="vc-bottom">' +
      '<button class="ic-btn note ' + (noted ? "active" : "") + '" onclick="openNoteModal(\'' + v.id + '\')" title="' + (noted ? "View note" : "Add note") + '">' + (noted ? noteFilledIcon : noteEmptyIcon) + '</button>' +
      '<button class="ic-btn vow ' + (vowActive ? "active" : "") + '" onclick="setVowById(\'' + v.id + '\')" title="Set as Verse of the Week">' + (vowActive ? starFilled : starEmpty) + '</button>' +
      '<button class="ic-btn fav ' + (favd ? "active" : "") + '" onclick="toggleFav(\'' + v.id + '\')">' + (favd ? heartFilled : heartEmpty) + '</button>' +
      '<button class="ic-btn" onclick="openActionMenu(\'' + v.id + '\')" title="More options">' + pencilIcon + '</button>' +
    '</div>' +
  '</div>';
}

// MAIN RENDER
function render() {
  var main = document.getElementById("mainContent");
  if (!currentUser) { renderAuth(); return; }
  if (currentView === "daily") { renderDaily(); return; }

  var list = [], html = "";
  if (currentView === "browse") {
    list = getFiltered(sortCanonical(verses));
    html += '<div class="page-title">Browse</div><div class="page-sub">All ' + verses.length + ' verses</div>' + filterRowHTML();
  }
  if (currentView === "favorites") {
    var favList = verses.filter(function(v) { return isFav(v); });
    list = getFiltered(sortCanonical(favList));
    html += '<div class="page-title">Saved</div><div class="page-sub">' + favIds.length + ' verse' + (favIds.length !== 1 ? "s" : "") + ' saved</div>' + filterRowHTML();
  }
  if (currentView === "notes") {
    var noteList = verses.filter(function(v) { return hasNote(v); });
    list = getFiltered(sortCanonical(noteList));
    var noteCount = Object.keys(notesMap).length;
    html += '<div class="page-title">Notes</div><div class="page-sub">' + noteCount + ' verse' + (noteCount !== 1 ? "s" : "") + ' with notes</div>' + filterRowHTML();
  }

  html += '<div class="sec-header"><span class="sec-title">Results</span><span class="sec-title">' + list.length + ' verse' + (list.length !== 1 ? "s" : "") + '</span></div>';
  if (!list.length) {
    if (currentView === "favorites") html += '<div class="empty">Nothing saved yet. Tap the heart on any verse to save it here.</div>';
    else if (currentView === "notes") html += '<div class="empty">No notes yet. Tap the note icon on any verse to add one.</div>';
    else html += '<div class="empty">No verses found.</div>';
  } else {
    html += '<div class="verse-grid">' + list.map(renderVerseCard).join("") + '</div>';
  }
  main.innerHTML = html;
}

// AUTH
function renderAuth() {
  document.getElementById("mainContent").innerHTML =
    '<div class="auth-wrap">' +
      '<div class="auth-hero">' +
        '<div class="auth-logo">Seed<span>.</span></div>' +
        '<div class="auth-tagline">Rooted in the Word. Strengthened by truth.</div>' +
      '</div>' +
      '<div class="auth-card">' +
        '<div class="auth-card-title">Welcome back</div>' +
        '<div class="auth-card-sub">Sign in to access your verses.</div>' +
        '<div class="auth-field"><label class="auth-label">Email</label><input class="auth-input" type="email" id="authEmail" placeholder="you@example.com" autocomplete="email"></div>' +
        '<div class="auth-field"><label class="auth-label">Password</label><input class="auth-input" type="password" id="authPassword" placeholder="Your password" autocomplete="current-password"></div>' +
        '<div id="authMsg"></div>' +
        '<button class="auth-btn" id="authSubmit" onclick="handleAuth()">Sign In</button>' +
      '</div>' +
    '</div>';
  setTimeout(function() { var e = document.getElementById("authEmail"); if (e) e.focus(); }, 100);
}
async function handleAuth() {
  var email = document.getElementById("authEmail").value.trim();
  var password = document.getElementById("authPassword").value;
  var btn = document.getElementById("authSubmit");
  var msg = document.getElementById("authMsg");
  if (!email || !password) { msg.innerHTML = '<div class="auth-error">Please enter your email and password.</div>'; return; }
  btn.disabled = true; btn.textContent = "Signing in..."; msg.innerHTML = "";
  var { error } = await db.auth.signInWithPassword({ email: email, password: password });
  if (error) { msg.innerHTML = '<div class="auth-error">' + error.message + '</div>'; btn.disabled = false; btn.textContent = "Sign In"; }
}
async function signOut() {
  closeHamburger();
  await db.auth.signOut();
  currentUser = null; verses = []; categories = []; favIds = []; notesMap = {}; vowData = null;
  document.getElementById("signOutBtn").style.display = "none";
  document.getElementById("addBtn").style.display = "none";
  document.getElementById("manageCatsBtn").style.display = "none";
  hideSplash();
  render();
}

// HAMBURGER
function closeHamburger() {
  document.getElementById("hamburgerMenu").classList.remove("open");
  document.getElementById("hamburgerBtn").classList.remove("active");
}
document.getElementById("hamburgerBtn").addEventListener("click", function(e) {
  e.stopPropagation();
  var menu = document.getElementById("hamburgerMenu");
  var isOpen = menu.classList.toggle("open");
  document.getElementById("hamburgerBtn").classList.toggle("active", isOpen);
});
document.addEventListener("click", function(e) {
  var menu = document.getElementById("hamburgerMenu");
  var btn = document.getElementById("hamburgerBtn");
  if (!menu.contains(e.target) && e.target !== btn) closeHamburger();
});
document.getElementById("manageCatsBtn").addEventListener("click", openManageCategories);

// DARK MODE
function applyDarkIcons() {
  document.getElementById("darkIcon").style.display = isDark ? "none" : "block";
  document.getElementById("lightIcon").style.display = isDark ? "block" : "none";
  document.getElementById("darkLabel").textContent = isDark ? "Light Mode" : "Dark Mode";
}
document.getElementById("darkToggle").addEventListener("click", function() {
  isDark = !isDark;
  document.body.classList.toggle("dark", isDark);
  localStorage.setItem("seed_dark", isDark);
  applyDarkIcons();
});
applyDarkIcons();

// CLOSE HANDLERS
document.getElementById("modalOverlay").addEventListener("click", function(e) { if (e.target === document.getElementById("modalOverlay")) closeModal(); });
document.getElementById("actionMenuOverlay").addEventListener("click", function(e) { if (e.target === document.getElementById("actionMenuOverlay")) closeActionMenu(); });
document.getElementById("changeCatOverlay").addEventListener("click", function(e) { if (e.target === document.getElementById("changeCatOverlay")) closeChangeCat(); });
document.getElementById("editVerseOverlay").addEventListener("click", function(e) { if (e.target === document.getElementById("editVerseOverlay")) closeEditVerse(); });

// NAV
document.querySelectorAll(".nav-item[data-view]").forEach(function(btn) {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".nav-item[data-view]").forEach(function(b) { b.classList.remove("active"); });
    btn.classList.add("active");
    currentView = btn.dataset.view;
    searchQuery = ""; selectedCat = "All"; selectedBook = "All";
    document.getElementById("searchInput").value = "";
    if (searchVisible) {
      searchVisible = false;
      document.getElementById("searchBar").style.display = "none";
      document.getElementById("searchToggle").classList.remove("active");
    }
    render();
  });
});
document.getElementById("searchToggle").addEventListener("click", function() {
  searchVisible = !searchVisible;
  document.getElementById("searchBar").style.display = searchVisible ? "block" : "none";
  document.getElementById("searchToggle").classList.toggle("active", searchVisible);
  if (searchVisible) document.getElementById("searchInput").focus();
});
document.getElementById("searchInput").addEventListener("input", function(e) {
  searchQuery = e.target.value;
  if (searchQuery && currentView === "daily") {
    currentView = "browse";
    document.querySelectorAll(".nav-item[data-view]").forEach(function(b) { b.classList.toggle("active", b.dataset.view === "browse"); });
  }
  render();
});
document.getElementById("addBtn").addEventListener("click", openAddModal);
document.getElementById("signOutBtn").addEventListener("click", signOut);

// APPLY USER
function applyUserUI(user) {
  currentUser = user;
  document.getElementById("hmEmail").textContent = user.email;
  document.getElementById("signOutBtn").style.display = "flex";
  document.getElementById("addBtn").style.display = "flex";
  document.getElementById("manageCatsBtn").style.display = "flex";
}

// AUTH STATE
db.auth.onAuthStateChange(async function(event, session) {
  if (event === "SIGNED_OUT" || event === "USER_DELETED") {
    currentUser = null; verses = []; categories = []; favIds = []; notesMap = {}; vowData = null;
    document.getElementById("signOutBtn").style.display = "none";
    document.getElementById("addBtn").style.display = "none";
    document.getElementById("manageCatsBtn").style.display = "none";
    hideSplash();
    render();
    return;
  }
  if (event === "SIGNED_IN" && session) {
    applyUserUI(session.user);
    document.getElementById("mainContent").innerHTML = skelDaily();
    await loadDataSafe();
    hideSplash();
    render();
    return;
  }
  if (event === "TOKEN_REFRESHED" && session) {
    applyUserUI(session.user);
    await loadDataSafe();
    hideSplash();
    render();
    return;
  }
});

(async function() {
  try {
    var result = await db.auth.getSession();
    var session = result.data.session;
    if (session) {
      applyUserUI(session.user);
      document.getElementById("mainContent").innerHTML = skelDaily();
      await loadDataSafe();
      hideSplash();
      render();
    } else {
      hideSplash();
      currentUser = null;
      render();
    }
  } catch(e) {
    hideSplash();
    currentUser = null;
    render();
  }
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("sw.js").catch(function(e) { console.log("SW failed", e); });
  });
}
</script>
